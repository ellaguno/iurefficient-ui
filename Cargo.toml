[package]
name = "iurefficient-ui"
description = "Kit de interfaz egui compartido de la suite Iurefficient (IureDesk, IureProject): tema, iconos, lista virtual, paleta de comandos"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Eduardo Llaguno"]
repository = "https://github.com/ellaguno/iurefficient-ui"
readme = "README.md"
publish = false

[features]
default = ["portal", "bundled-fonts"]
# Sigue en vivo el modo claro/oscuro del escritorio por el portal XDG (Linux; zbus, Rust puro).
# Fuera de Linux, o sin esta característica, `system::watch_system_theme` no hace nada.
portal = ["dep:zbus"]
# Incluye Inter 4.1 (OFL-1.1; Regular, Medium, SemiBold, Bold y cifras tabulares, ~1.7 MB) para
# que la interfaz se vea igual en todos los sistemas. Sin ella se usa la fuente libre del sistema.
bundled-fonts = []

[dependencies]
# `default_fonts`: `system::install_fonts` usa las fuentes de egui como respaldo (símbolos y el
# caso sin fuente libre instalada); sin ellas egui 0.37 no trae ninguna y falla al dibujar texto.
egui = { version = "0.37", features = ["default_fonts"] }
# Idioma del sistema en Windows y macOS (Rust puro; usa las APIs del SO, sin crates -sys).
sys-locale = "0.3"
# Valida un archivo de fuente antes de dárselo a egui (que entra en pánico con uno dañado). Es la
# misma versión que ya usa epaint para leer las fuentes: no agrega código nuevo al binario.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

